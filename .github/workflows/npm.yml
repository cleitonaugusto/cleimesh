name: npm
# Stages the npm launcher for a release: it downloads that release's binary
# on first use and checks it against the checksums set here. Trusted
# publishing with provenance (no token stored). The version is staged, not
# published: the owner approves it on npmjs.com (Staged Packages) with 2FA.
# Run by hand for a release tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.2.5)
        required: true
      ref:
        description: Commit or branch to build from (the tag, or main when the tag predates the packaging)
        required: false
        default: main
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: packaging/npm/prepare.sh "${{ inputs.tag }}"
      - run: npm stage publish --provenance --access public
        working-directory: packaging/npm
