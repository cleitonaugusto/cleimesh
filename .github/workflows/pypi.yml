name: PyPI
# Builds wheels that carry the cleimesh binary and publishes them with PyPI
# trusted publishing (no token stored anywhere). Run by hand for a release tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.2.5)
        required: true
      ref:
        description: Commit or branch to build from (the tag, or main when the tag predates the packaging)
        required: false
        default: main
permissions:
  contents: read
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: macos-14, target: aarch64-apple-darwin, manylinux: "off" }
          - { os: macos-13, target: x86_64-apple-darwin, manylinux: "off" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, manylinux: "off" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -m cleimesh-cli/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist
  publish:
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
