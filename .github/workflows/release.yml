name: Release

# A tag v* builds the `cleimesh` binary for every target, with a SHA-256 per
# file, and publishes a GitHub release that scripts/install.sh installs from.
# A push that changes this workflow or the installer builds the same
# artifacts without publishing, so the matrix is tested before a tag relies
# on it (macOS and Windows minutes cost more on private repositories, hence
# not on every push). workflow_dispatch does the same by hand.
on:
  # Branch pushes need both filters to match; tag pushes ignore `paths`.
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/install.sh'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static (musl): they run on any distribution,
          # old glibc or none (Alpine), not only on the runner's.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          echo "CC_$(echo ${{ matrix.target }} | tr - _)=musl-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin cleimesh
      - name: Package with checksum
        run: |
          mkdir -p dist
          exe=""; [ "${{ runner.os }}" = Windows ] && exe=".exe"
          name="cleimesh-${{ matrix.target }}$exe"
          cp "target/${{ matrix.target }}/release/cleimesh$exe" "dist/$name"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: cleimesh-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  release:
    name: Publish release
    # Publishes what was built even if one platform failed, so a Windows or
    # macOS problem doesn't hold back the Linux binaries the installer uses.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add the installer
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            [ -f "dist/cleimesh-$t" ] || { echo "missing the $t binary" >&2; exit 1; }
          done
          ls dist
          cp scripts/install.sh dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
