[workspace]
resolver = "2"
members = [
    "cleimesh-core",
    "cleimesh-aat",
    "cleimesh-receipt",
    "cleimesh-wasm-sandbox",
    "cleimesh-p2p",
    "cleimesh-cli",
    "cleimesh-observability",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Cleiton Augusto"]
description = "Signed, delegable permissions and sandboxed execution for AI agent tools"
repository = "https://github.com/cleitonaugusto/cleimesh"
homepage = "https://github.com/cleiton/cleimesh"
readme = "README.md"
keywords = ["wasm", "p2p", "ai-agents", "wasm-sandbox", "rag", "decentralized"]
categories = ["command-line-utilities", "distributed-systems", "wasm"]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
wasmtime = "48.0.7"
wasmtime-wasi = "48.0.7"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "1.0"
bytes = "1.5"
parking_lot = "0.12"
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
wit-bindgen = { version = "0.61", features = ["macros", "realloc", "async"] }
wit-bindgen-wasmtime = { version = "0.61", features = ["wasmtime"] }
rand = "0.8"
sled = "0.34"
bincode = "1.3"
bytemuck = "1.14"
hnsw = "0.11"
space = "0.17"
clap = { version = "4.5", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics = "0.24"
criterion = "0.5"
libp2p = { version = "0.57", features = ["tcp", "dns", "tokio", "noise", "yamux", "mdns", "kad", "gossipsub", "identify", "ping", "relay", "dcutr", "request-response", "macros"] }
libp2p-tcp = { version = "0.45", features = ["tokio"] }
metrics-exporter-prometheus = "0.18"
axum = "0.7"
tower-http = { version = "0.5", features = ["trace"] }
chrono = "0.4"
tempfile = "3"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
base64 = "0.22"
sha2 = "0.10"
semver = "1.0"
toml = "0.8"
home = "0.5"
directories = "5.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.bench]
opt-level = 3
lto = true

[profile.dev]
opt-level = 0
debug = true