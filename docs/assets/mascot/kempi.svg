<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Kempi, the CleiMesh mascot: a cubist chess automaton</title>
  <!-- Kempi: a chess-playing automaton in cubist planes, after Kempelen's
       machine of 1770. A face seen from the front and in profile at once, a
       chess king's crown, the chess cabinet as the body, with a keyhole on its
       door: don't trust what the machine appears to do, open the box and
       check. Palette: ink, cream, rust, slate, ochre. -->
  <g stroke="#16202e" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
    <!-- cabinet (body) -->
    <polygon points="96,330 416,330 438,486 74,486" fill="#e9dfc8"/>
    <polygon points="96,330 256,330 256,486 74,486" fill="#d8cdb2"/>
    <!-- chessboard on the cabinet top, in perspective -->
    <polygon points="118,300 394,300 416,330 96,330" fill="#f3ecdc"/>
    <polygon points="152,300 186,300 182,330 140,330" fill="#16202e" stroke-width="0"/>
    <polygon points="220,300 254,300 256,330 222,330" fill="#16202e" stroke-width="0"/>
    <polygon points="288,300 322,300 332,330 290,330" fill="#16202e" stroke-width="0"/>
    <polygon points="356,300 390,300 404,330 360,330" fill="#16202e" stroke-width="0"/>
    <polygon points="118,300 394,300 416,330 96,330" fill="none"/>
    <!-- cabinet door with the keyhole -->
    <polygon points="290,360 392,360 404,462 294,462" fill="#b5482a"/>
    <circle cx="346" cy="398" r="14" fill="#16202e" stroke-width="0"/>
    <polygon points="338,404 354,404 360,436 332,436" fill="#16202e" stroke-width="0"/>
    <!-- gears glimpsed through the left panel -->
    <polygon points="191.8,406.2 203.9,406.9 203.9,413.1 191.8,413.8 188.0,425.6 197.3,433.3 193.7,438.3 183.5,431.8 173.5,439.0 176.5,450.8 170.6,452.7 166.2,441.4 153.8,441.4 149.4,452.7 143.5,450.8 146.5,439.0 136.5,431.8 126.3,438.3 122.7,433.3 132.0,425.6 128.2,413.8 116.1,413.1 116.1,406.9 128.2,406.2 132.0,394.4 122.7,386.7 126.3,381.7 136.5,388.2 146.5,381.0 143.5,369.2 149.4,367.3 153.8,378.6 166.2,378.6 170.6,367.3 176.5,369.2 173.5,381.0 183.5,388.2 193.7,381.7 197.3,386.7 188.0,394.4" fill="#c9b78f" stroke-width="6"/>
    <circle cx="160" cy="410" r="12" fill="#16202e"/>

    <!-- torso and fur collar, faceted -->
    <polygon points="170,300 210,232 302,232 342,300" fill="#5b7088"/>
    <polygon points="210,232 256,232 256,300 170,300" fill="#4a5d73"/>
    <polygon points="226,232 286,232 270,262 242,262" fill="#f3ecdc"/>
    <!-- arm reaching to the board -->
    <polygon points="330,268 392,250 404,292 350,298" fill="#4a5d73"/>
    <polygon points="392,250 420,262 414,292 404,292" fill="#e9dfc8"/>

    <!-- face: the left half in profile (slate), the right half frontal (cream) -->
    <polygon points="256,120 318,132 330,186 300,230 256,236" fill="#f3ecdc"/>
    <polygon points="256,120 198,134 186,168 160,188 190,198 196,230 256,236" fill="#c9b78f"/>
    <!-- profile eye (almond) -->
    <polygon points="206,160 236,154 232,170" fill="#16202e" stroke-width="4"/>
    <!-- frontal eye: a circle with a keyhole pupil -->
    <circle cx="290" cy="166" r="18" fill="#ffffff"/>
    <circle cx="290" cy="163" r="6" fill="#16202e" stroke-width="0"/>
    <polygon points="287,166 293,166 295,178 285,178" fill="#16202e" stroke-width="0"/>
    <!-- mouth: a speaker grille -->
    <polygon points="226,204 286,204 282,222 230,222" fill="#16202e" stroke-width="4"/>
    <line x1="240" y1="206" x2="240" y2="220" stroke="#e8c46a" stroke-width="3"/>
    <line x1="256" y1="206" x2="256" y2="220" stroke="#e8c46a" stroke-width="3"/>
    <line x1="272" y1="206" x2="272" y2="220" stroke="#e8c46a" stroke-width="3"/>
    <line x1="256" y1="120" x2="256" y2="236" stroke-width="5"/>

    <!-- head cap: a riveted band -->
    <polygon points="190,120 322,120 318,140 194,140" fill="#5b7088"/>
    <circle cx="214" cy="130" r="4" fill="#e8c46a" stroke-width="0"/>
    <circle cx="256" cy="130" r="4" fill="#e8c46a" stroke-width="0"/>
    <circle cx="298" cy="130" r="4" fill="#e8c46a" stroke-width="0"/>
    <!-- chess king's crown, faceted -->
    <polygon points="196,120 186,70 222,96 256,58 290,96 326,70 316,120" fill="#e8c46a"/>
    <polygon points="196,120 186,70 222,96 256,58 256,120" fill="#d3a94a"/>
    <!-- a gold orb on top of the crown -->
    <circle cx="256" cy="40" r="17" fill="#e8c46a" stroke-width="6"/>
    <line x1="256" y1="57" x2="256" y2="62" stroke-width="6"/>
  </g>
</svg>
