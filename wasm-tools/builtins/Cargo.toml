[package]
name = "cleimesh-builtins"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Built-in CleiMesh tools, compiled to wasm32-wasip1 and run inside the sandbox"
publish = false

# Guest crate: built for wasm32-wasip1, kept out of the host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
